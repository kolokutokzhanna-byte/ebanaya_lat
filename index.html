<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Латинские карточки</title>
<style>
:root{

--tr:#ad1457;--term:#880e4f;--decl:#6a1b3e;--hint:#d81b60;--btn:#ec407a;--btn-hover:#d81b60;

--modal-header-border:#ffd6e7;--modal-title:#ad1457;--tab-text:#d81b60;--tab-active-bg:#ffd6e7;--tab-active-text:#880e4f;
--li-bg:#fff;--li-border:#f48fb1;--li-ru:#880e4f;--li-la:#6a1b3e;--stats:#ad1457;--empty:#d81b60;
}
body.dark{
--bg1:#1a0a12;--bg2:#2d0f1f;--bg3:#4a1530;--text:#f5d5e0;--title:#ff8fb8;--counter:#ff6b9d;
--front1:#3d1528;--front2:#5a1f3a;--front-border:#a83a5e;--back1:#5a1f3a;--back2:#7a2a4e;--back-border:#ff6b9d;
--tr:#ffb3d1;--term:#ffd6e7;--decl:#e8b8cc;--hint:#ff8fb8;--btn:#c2185b;--btn-hover:#e91e63;
--know1:#e91e63;--know2:#ff4081;--shuffle:#7b3fa0;--shuffle-hover:#9a4fc9;--list:#a83a5e;--list-text:#ffd6e7;
--progress-bg:#4a1530;--progress1:#ff6b9d;--progress2:#e91e63;--modal-bg:#2d0f1f;--modal-border:#a83a5e;
--modal-header-border:#4a1530;--modal-title:#ff8fb8;--tab-text:#ff8fb8;--tab-active-bg:#4a1530;--tab-active-text:#ffd6e7;
--li-bg:#3d1528;--li-border:#a83a5e;--li-ru:#ffd6e7;--li-la:#e8b8cc;--stats:#ff8fb8;--empty:#ff8fb8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:var(--text);transition:background .3s,color .3s}
h1{font-size:1.3rem;margin-bottom:5px;color:var(--title);text-align:center}
.counter{font-size:.95rem;color:var(--counter);margin-bottom:15px;font-weight:600}
.scene{width:100%;max-width:520px;height:340px;perspective:1200px}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}
.front{background:linear-gradient(145deg,var(--front1),var(--front2));border:3px solid var(--front-border)}
.back{background:linear-gradient(145deg,var(--back1),var(--back2));border:3px solid var(--back-border);transform:rotateY(180deg)}
.front .translation{font-size:2rem;font-weight:700;color:var(--tr);line-height:1.2}
.back .term{font-size:1.7rem;font-weight:700;color:var(--term);margin-bottom:12px;line-height:1.2}
.back .declension{font-size:.95rem;color:var(--decl);line-height:1.5;font-style:italic}
.hint{font-size:.85rem;color:var(--hint);margin-top:18px;opacity:.7}
.controls{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;justify-content:center}
button{padding:11px 18px;border:none;border-radius:14px;font-size:.92rem;font-weight:600;cursor:pointer;transition:.2s;color:#fff}
button:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,.2)}
.nav-btn{background:var(--btn)}.nav-btn:hover{background:var(--btn-hover)}
.know-btn{background:linear-gradient(135deg,var(--know1),var(--know2));padding:11px 22px;font-size:.95rem}
.shuffle{background:var(--shuffle)}.shuffle:hover{background:var(--shuffle-hover)}
.list-btn{background:var(--list);color:var(--list-text)}.list-btn:hover{background:var(--btn-hover);color:#fff}
.theme-btn{background:transparent;color:var(--title);font-size:1.2rem;padding:6px 10px;border:2px solid var(--front-border)}
.theme-btn:hover{background:var(--front-border);color:#fff;transform:none;box-shadow:none}
.progress-bar{width:100%;max-width:520px;height:8px;background:var(--progress-bg);border-radius:4px;margin-top:18px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--progress1),var(--progress2));transition:width .3s}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-content{background:var(--modal-bg);border-radius:20px;width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.5);border:3px solid var(--modal-border)}
.modal-header{padding:18px 22px;border-bottom:2px solid var(--modal-header-border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:1.15rem;color:var(--modal-title)}
.close-btn{background:transparent;color:var(--modal-title);font-size:1.5rem;padding:0 8px;line-height:1}
.close-btn:hover{color:var(--btn-hover);transform:none;box-shadow:none}
.modal-tabs{display:flex;border-bottom:2px solid var(--modal-header-border)}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-weight:600;color:var(--tab-text);background:transparent;border:none;border-radius:0;font-size:.9rem}
.tab.active{background:var(--tab-active-bg);color:var(--tab-active-text)}
.modal-body{overflow-y:auto;padding:16px 22px;flex:1}
.modal-body ul{list-style:none}
.modal-body li{padding:10px 12px;margin-bottom:6px;background:var(--li-bg);border-radius:10px;border-left:4px solid var(--li-border);font-size:.9rem}
.modal-body li .ru{font-weight:600;color:var(--li-ru)}
.modal-body li .la{color:var(--li-la);font-size:.85rem;margin-top:3px;font-style:italic}
.empty-msg{text-align:center;color:var(--empty);padding:30px;font-style:italic}
.stats{padding:10px 22px;font-size:.85rem;color:var(--stats);text-align:center}
.deck-select{width:100%;max-width:520px;margin-bottom:15px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.deck-select select{padding:10px 14px;border-radius:12px;border:2px solid var(--front-border);background:var(--front1);color:var(--title);font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.deck-select label{font-size:.85rem;color:var(--title);font-weight:600;align-self:center}
@media(max-width:480px){.front .translation{font-size:1.5rem}.back .term{font-size:1.3rem}.back .declension{font-size:.85rem}button{padding:9px 14px;font-size:.85rem}}
</style>
</head>
<body>
<h1>🌸 Латинские анатомические карточки</h1>
<div class="counter" id="counter">1 / N</div>
<div class="deck-select">
<label>📚 Колода:</label>
<select id="deckSelect" onchange="changeDeck()">
<option value="all">Всё вместе</option>
<option value="min1">Минимум 1 — сущ. I–II скл.</option>
<option value="min2">Минимум 2 — сущ. III–V скл. + словосоч.</option>
<option value="min3">Минимум 3 — прилагательные</option>
</select>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="Тема">🌙</button>
</div>
<div class="scene">
<div class="card" id="card" onclick="flip()">
<div class="face front">
<div class="translation" id="frontTranslation"></div>
<div class="hint">нажми, чтобы увидеть латынь</div>
</div>
<div class="face back">
<div class="term" id="backTerm"></div>
<div class="declension" id="backDeclension"></div>
</div>
</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
<div class="controls">
<button class="nav-btn" onclick="prev()">← Назад</button>
<button class="know-btn" onclick="markKnown()">Знаю, блять ✅</button>
<button class="nav-btn" onclick="next()">Вперёд →</button>
</div>
<div class="controls" style="margin-top:10px">
<button class="shuffle" onclick="shuffle()">🔀 Перемешать</button>
<button class="list-btn" onclick="openModal()">📋 Списки</button>
<button class="list-btn" onclick="openBrowse()">📖 Полистать все</button>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<div class="modal-header"><h2>📋 Мои карточки</h2><button class="close-btn" onclick="closeModal()">×</button></div>
<div class="modal-tabs">
<button class="tab active" id="tabUnknown" onclick="switchTab('unknown')">🤔 Не знаю (<span id="cntUnknown">0</span>)</button>
<button class="tab" id="tabKnown" onclick="switchTab('known')">✅ Знаю (<span id="cntKnown">0</span>)</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div class="stats" id="stats"></div>
</div>
</div>
<div class="modal" id="browseModal" onclick="if(event.target===this)closeBrowse()">
<div class="modal-content">
<div class="modal-header"><h2>📖 Все слова</h2><button class="close-btn" onclick="closeBrowse()">×</button></div>
<div class="modal-body" id="browseBody"></div>
<div class="stats" id="browseStats"></div>
</div>
</div>

let knownSet=new Set();
let currentDeck="all";
let deck=[];
let idx=0;
let flipped=false;

function saveState(){try{localStorage.setItem('latin_known',JSON.stringify([...knownSet]));localStorage.setItem('latin_deck',currentDeck);localStorage.setItem('latin_theme',document.body.classList.contains('dark')?'dark':'light')}catch(e){}}
function loadState(){
try{
const s=localStorage.getItem('latin_known');
if(s)knownSet=new Set(JSON.parse(s));
const d=localStorage.getItem('latin_deck');
if(d)currentDeck=d;
const t=localStorage.getItem('latin_theme');
if(t==='dark')document.body.classList.add('dark');
}catch(e){}
}
function getDeckCards(){return currentDeck==='all'?allCards:allCards.filter(c=>c.deck===currentDeck)}
function buildDeck(){deck=getDeckCards().filter(c=>!knownSet.has(key(c)));idx=0;flipped=false}

const cardEl=document.getElementById('card');
const frontTrEl=document.getElementById('frontTranslation');
const backTermEl=document.getElementById('backTerm');
const backDeclEl=document.getElementById('backDeclension');
const counterEl=document.getElementById('counter');
const progressEl=document.getElementById('progress');

function render(){
const base=getDeckCards();
if(deck.length===0){
frontTrEl.textContent="🎉 Все карточки выучены!";
backTermEl.textContent="";
backDeclEl.textContent="Выбери другую колоду или нажми «Списки»";
counterEl.textContent="0 / 0";
progressEl.style.width='100%';
if(flipped){cardEl.classList.remove('flipped');flipped=false}
return;
}
if(idx>=deck.length)idx=0;
const c=deck[idx];
frontTrEl.textContent=c.tr;
backTermEl.textContent=c.t;
backDeclEl.innerHTML=c.d+`<div style="margin-top:10px;font-size:0.8rem;color:var(--counter);font-style:normal;font-weight:600">${c.g}</div>`;
counterEl.textContent=`${idx+1} / ${deck.length}`;
progressEl.style.width=((idx+1)/deck.length*100)+'%';
if(flipped){cardEl.classList.remove('flipped');flipped=false}
}
function flip(){if(deck.length===0)return;flipped=!flipped;cardEl.classList.toggle('flipped',flipped)}
function next(){if(deck.length===0)return;idx=(idx+1)%deck.length;if(flipped){cardEl.classList.remove('flipped');flipped=false}setTimeout(render,50)}
function prev(){if(deck.length===0)return;idx=(idx-1+deck.length)%deck.length;if(flipped){cardEl.classList.remove('flipped');flipped=false}setTimeout(render,50)}
function markKnown(){if(deck.length===0)return;const c=deck[idx];knownSet.add(key(c));saveState();deck.splice(idx,1);if(idx>=deck.length)idx=0;if(flipped){cardEl.classList.remove('flipped');flipped=false}setTimeout(render,50)}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;if(flipped){cardEl.classList.remove('flipped');flipped=false}setTimeout(render,50)}
function changeDeck(){currentDeck=document.getElementById('deckSelect').value;saveState();buildDeck();render()}

function toggleTheme(){
document.body.classList.toggle('dark');
document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
saveState();
}

let currentTab='unknown';
function openModal(){document.getElementById('modal').classList.add('open');renderModal()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function switchTab(tab){currentTab=tab;document.getElementById('tabUnknown').classList.toggle('active',tab==='unknown');document.getElementById('tabKnown').classList.toggle('active',tab==='known');renderModal()}
function renderModal(){
const base=getDeckCards();
const knownList=base.filter(c=>knownSet.has(key(c)));
const unknownList=base.filter(c=>!knownSet.has(key(c)));
document.getElementById('cntKnown').textContent=knownList.length;
document.getElementById('cntUnknown').textContent=unknownList.length;
const list=currentTab==='known'?knownList:unknownList;
const body=document.getElementById('modalBody');
if(list.length===0){
body.innerHTML=`<div class="empty-msg">${currentTab==='known'?'Пока ничего не выучено 💪':'Все карточки выучены! 🎉'}</div>`;
}else{
body.innerHTML='<ul>'+list.map(c=>`<li><div class="ru">${c.tr}</div><div class="la">${c.t} — ${c.d} <span style="color:var(--counter);font-weight:600">[${c.g}]</span></div></li>`).join('')+'</ul>';
}
document.getElementById('stats').textContent=`В колоде: ${base.length} · Знаю: ${knownList.length} · Осталось: ${unknownList.length}`;
}

function openBrowse(){document.getElementById('browseModal').classList.add('open');renderBrowse()}
function closeBrowse(){document.getElementById('browseModal').classList.remove('open')}
function renderBrowse(){
const base=getDeckCards();
const body=document.getElementById('browseBody');
if(base.length===0){body.innerHTML='<div class="empty-msg">Пусто</div>';return}
body.innerHTML='<ul>'+base.map(c=>{
const known=knownSet.has(key(c));
return `<li style="border-left-color:${known?'#4caf50':'var(--li-border)'}"><div class="ru">${c.tr} ${known?'✅':''}</div><div class="la">${c.t} — ${c.d} <span style="color:var(--counter);font-weight:600">[${c.g}]</span></div></li>`;
}).join('')+'</ul>';
document.getElementById('browseStats').textContent=`Всего в колоде: ${base.length}`;
}

document.addEventListener('keydown',e=>{
if(document.getElementById('modal').classList.contains('open')){if(e.key==='Escape')closeModal();return}
if(document.getElementById('browseModal').classList.contains('open')){if(e.key==='Escape')closeBrowse();return}
if(e.key==='ArrowRight')next();
else if(e.key==='ArrowLeft')prev();
else if(e.key===' '){e.preventDefault();flip()}
});

loadState();
document.getElementById('deckSelect').value=currentDeck;
document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
buildDeck();
render();
</script>
